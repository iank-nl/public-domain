# Intake form backend for iank.nl. See README.md for setup.
name = "iank-intake"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[vars]
# Origins allowed to post. Add http://localhost:4321 for `npm run dev` of the site.
ALLOWED_ORIGINS = "https://iank.nl,http://localhost:4321"
# The only address this Worker ever sends to. Never taken from the request.
TO_EMAIL = "hello@iank.nl"
# Sender, on the domain verified in Resend (mail.iank.nl).
FROM_EMAIL = "intake@mail.iank.nl"

# Secrets (set with `wrangler secret put`, never in this file):
#   TURNSTILE_SECRET   Turnstile secret key
#   FORM_SIGNING_KEY   long random string
#   RESEND_API_KEY     Resend API key (sending access); mail goes out through Resend

# Rate limiting: a counter per hashed IP per hour, expired by KV TTL.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "38d028252e224219982b48f00242c641"

# Mail goes through Resend. Email Routing is not enabled on iank.nl (it would replace the
# existing MX records), so there is no send_email binding. To switch, see README.md, option A.

[observability]
enabled = true
